apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tpu-device-plugin
  namespace: kube-system
  labels:
    k8s-app: tpu-device-plugin
spec:
  selector:
    matchLabels:
      k8s-app: tpu-device-plugin
  template:
    metadata:
      labels:
        k8s-app: tpu-device-plugin
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-tpu-accelerator
                operator: Exists
      tolerations:
      - operator: "Exists"
        effect: "NoExecute"
      - operator: "Exists"
        effect: "NoSchedule"
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: DirectoryOrCreate
      - name: dev
        hostPath:
          path: /dev
          type: DirectoryOrCreate
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      - name: pod-resources
        hostPath:
          path: /var/lib/kubelet/pod-resources
          type: DirectoryOrCreate
      - name: tpu-env
        hostPath:
          path: /etc/tpu
          type: DirectoryOrCreate
      - name: tpu-logs
        hostPath:
          path: /tmp/tpu_logs
          type: DirectoryOrCreate
      containers:
      - image: "gcr.io/gke-release/tpu-device-plugin:<TAG>" # Change to image you are trying to deploy
        name: tpu-device-plugin
        env:
        - name: CLUSTER_PROJECT
          value: "<PROJECT_NUMBER>"   # Change to valid project number, used for metrics
        - name: CLUSTER_LOCATION
          value: "us-west1-b"     # Change to valid cluster location, used for metrics
        - name: CLUSTER_NAME
          value: "my-cluster"     # Change to valid cluster name, used for metrics
        - name: CONTAINER_NAME
          value: "tpu-device-plugin"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: CLOUD_MONITORING_ENDPOINT
          value: ""
        resources:
          requests:
            cpu: 80m
            memory: 80Mi
          limits:
            memory: 80Mi
        securityContext:
          privileged: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: device-plugin
          mountPath: /device-plugin
        - name: dev
          mountPath: /dev
        - name: sys
          mountPath: /sys
        - name: pod-resources
          mountPath: /var/lib/kubelet/pod-resources
        - name: tpu-logs
          mountPath: /tmp/tpu_logs
      - image: "gcr.io/gke-release/gke-distroless/bash:<TAG>"
        name: sidecar-log-collector
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 20m
            memory: 20Mi
          limits:
            memory: 20Mi
        args: [/bin/sh, -c, 'tail -n+1 -F /tmp/tpu_logs/tpu_driver.INFO']
        volumeMounts:
        - name: tpu-logs
          readOnly: true
          mountPath: /tmp/tpu_logs
  updateStrategy:
    type: RollingUpdate