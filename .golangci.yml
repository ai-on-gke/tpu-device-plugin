#    - usestdlibvars
#    - varnamelen
#    - wastedassign
#    - whitespace
#    - wrapcheck
#    - wsl
#    - zerologlint

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
