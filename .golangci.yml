version: "2"
linters:
  # Disable all linters.
  default: none
  # Enable specific linter
  # https://golangci-lint.run/usage/linters/#enabled-by-default
  enable:
    - errcheck
    - govet
    - ineffassign
#    - staticcheck
    - unused

#    - asasalint
#    - asciicheck
#    - bidichk
#    - bodyclose
#    - canonicalheader
#    - containedctx
#    - contextcheck
#    - copyloopvar
#    - cyclop
#    - decorder
#    - depguard
#    - dogsled
#    - dupl
#    - dupword
#    - durationcheck
#    - err113
#    - errchkjson
#    - errname
#    - errorlint
#    - execinquery
#    - exhaustive
#    - exhaustruct
#    - exportloopref
#    - fatcontext
#    - forbidigo
#    - forcetypeassert
#    - funlen
#    - gci
#    - ginkgolinter
#    - gocheckcompilerdirectives
#    - gochecknoglobals
#    - gochecknoinits
#    - gochecksumtype
#    - gocognit
#    - goconst
#    - gocritic
#    - gocyclo
#    - godot
#    - godox
#    - gofmt
#    - gofumpt
#    - goheader
#    - goimports
#    - gomoddirectives
#    - gomodguard
#    - goprintffuncname
#    - gosec
